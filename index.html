<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitPulse - Dashboard Kebiasaan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-16">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Flame, Plus, Check, ChevronLeft, ChevronRight, Calendar, Trash2, Edit3, Download, Upload, FileSpreadsheet, RefreshCw } = lucide;

        function App() {
            const [habits, setHabits] = useState(() => {
                const saved = localStorage.getItem('habitpulse_habits');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: 'Minum 2L Air Putih', category: 'Kesehatan', target: 7, logs: {} },
                    { id: 2, name: 'Olahraga 15 Menit', category: 'Kebugaran', target: 5, logs: {} },
                    { id: 3, name: 'Membaca Buku', category: 'Pengembangan', target: 7, logs: {} }
                ];
            });

            const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().slice(0, 10));
            const [newHabitName, setNewHabitName] = useState('');
            const [newCategory, setNewCategory] = useState('Kesehatan');
            const [activeTab, setActiveTab] = useState('daily');

            useEffect(() => {
                localStorage.setItem('habitpulse_habits', JSON.stringify(habits));
            }, [habits]);

            const toggleLog = (id, date) => {
                setHabits(habits.map(h => {
                    if (h.id !== id) return h;
                    const logs = { ...(h.logs || {}) };
                    if (logs[date]) {
                        delete logs[date];
                    } else {
                        logs[date] = true;
                    }
                    return { ...h, logs };
                }));
            };

            const addHabit = (e) => {
                e.preventDefault();
                if (!newHabitName.trim()) return;
                const newHabit = {
                    id: Date.now(),
                    name: newHabitName.trim(),
                    category: newCategory,
                    target: 7,
                    logs: {}
                };
                setHabits([...habits, newHabit]);
                setNewHabitName('');
            };

            const deleteHabit = (id) => {
                setHabits(habits.filter(h => h.id !== id));
            };

            const getPast7Days = () => {
                const dates = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    dates.push(d.toISOString().slice(0, 10));
                }
                return dates;
            };

            const weekDays = getPast7Days();

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-900 border border-slate-800 p-5 rounded-2xl mb-6 gap-4">
                        <div>
                            <h1 className="text-xl font-bold text-white flex items-center gap-2">
                                <Flame className="w-6 h-6 text-amber-500 fill-amber-500/20" /> HabitPulse Dashboard
                            </h1>
                            <p className="text-xs text-slate-400">Kelola target harian dan pantau konsistensi Anda.</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setActiveTab('daily')} className={`px-4 py-2 rounded-xl text-xs font-semibold ${activeTab === 'daily' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                                Check-In Harian
                            </button>
                            <button onClick={() => setActiveTab('weekly')} className={`px-4 py-2 rounded-xl text-xs font-semibold ${activeTab === 'weekly' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                                Weekly Streak
                            </button>
                            <button onClick={() => setActiveTab('manage')} className={`px-4 py-2 rounded-xl text-xs font-semibold ${activeTab === 'manage' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                                Kelola Habit
                            </button>
                        </div>
                    </header>

                    {activeTab === 'daily' && (
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                            <div className="flex justify-between items-center">
                                <h2 className="font-bold text-base text-white">Check-In Tanggal</h2>
                                <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white" />
                            </div>
                            <div className="space-y-3">
                                {habits.map(habit => {
                                    const isDone = !!habit.logs?.[selectedDate];
                                    return (
                                        <div key={habit.id} onClick={() => toggleLog(habit.id, selectedDate)} className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${isDone ? 'bg-emerald-950/30 border-emerald-500/40' : 'bg-slate-950 border-slate-800'}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`w-6 h-6 rounded-lg flex items-center justify-center border ${isDone ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-700'}`}>
                                                    {isDone && <Check className="w-4 h-4 stroke-[3]" />}
                                                </div>
                                                <div>
                                                    <h3 className={`font-medium text-sm ${isDone ? 'line-through text-slate-500' : 'text-white'}`}>{habit.name}</h3>
                                                    <span className="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded">{habit.category}</span>
                                                </div>
                                            </div>
                                            <span className="text-xs text-slate-500">{isDone ? 'Selesai' : 'Belum'}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {activeTab === 'weekly' && (
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 overflow-x-auto">
                            <h2 className="font-bold text-base text-white mb-4">Weekly Streak Matrix</h2>
                            <table className="w-full text-left border-collapse min-w-[500px]">
                                <thead>
                                    <tr className="border-b border-slate-800 text-xs text-slate-400">
                                        <th className="pb-3">Habit</th>
                                        {weekDays.map(d => <th key={d} className="pb-3 text-center">{d.slice(5)}</th>)}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {habits.map(habit => (
                                        <tr key={habit.id}>
                                            <td className="py-3 text-sm font-medium text-white">{habit.name}</td>
                                            {weekDays.map(d => {
                                                const done = !!habit.logs?.[d];
                                                return (
                                                    <td key={d} className="py-3 text-center">
                                                        <button onClick={() => toggleLog(habit.id, d)} className={`w-8 h-8 rounded-lg mx-auto flex items-center justify-center ${done ? 'bg-emerald-500 text-white' : 'bg-slate-950 border border-slate-800'}`}>
                                                            <Check className="w-4 h-4 stroke-[3]" />
                                                        </button>
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {activeTab === 'manage' && (
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-5">
                            <h2 className="font-bold text-base text-white">Tambah Habit Baru</h2>
                            <form onSubmit={addHabit} className="flex gap-2">
                                <input type="text" placeholder="Nama habit..." value={newHabitName} onChange={(e) => setNewHabitName(e.target.value)} className="flex-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white" />
                                <select value={newCategory} onChange={(e) => setNewCategory(e.target.value)} className="px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
                                    <option value="Kesehatan">Kesehatan</option>
                                    <option value="Kebugaran">Kebugaran</option>
                                    <option value="Pengembangan">Pengembangan</option>
                                </select>
                                <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl">Tambah</button>
                            </form>

                            <div className="space-y-2 pt-2">
                                <h3 className="text-xs font-bold uppercase text-slate-400">Daftar Habit Aktif</h3>
                                {habits.map(habit => (
                                    <div key={habit.id} className="flex justify-between items-center p-3 bg-slate-950 border border-slate-800 rounded-xl">
                                        <span className="text-sm font-medium text-white">{habit.name}</span>
                                        <button onClick={() => deleteHabit(habit.id)} className="text-rose-400 text-xs font-medium flex items-center gap-1 hover:text-rose-300">
                                            <Trash2 className="w-4 h-4" /> Hapus
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
