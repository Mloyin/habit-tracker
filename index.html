<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitPulse - Dashboard Kebiasaan & Streak</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK (Modular v9) -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
      }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-indigo-500 selection:text-white pb-16">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "firebase/firestore";

        // Konfigurasi Firebase Publik Aman untuk Client-side
        const firebaseConfig = {
            apiKey: "AIzaSyD-PlaceholderKeyForGitHubPages-Dummy",
            authDomain: "habitpulse-cloud.firebaseapp.com",
            projectId: "habitpulse-cloud",
            storageBucket: "habitpulse-cloud.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.firebaseDb = { db, auth, doc, setDoc, getDoc, onSnapshot, signInAnonymously, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { 
            CheckCircle2, Flame, Plus, Trash2, Edit3, BarChart3, Calendar, 
            ChevronLeft, ChevronRight, Award, TrendingUp, Sparkles, Check, 
            X, Dumbbell, BookOpen, Droplets, Moon, Brain, Code, Apple, 
            Music, Sun, ShieldCheck, Zap, RotateCcw, Cloud, CloudOff, 
            Download, Upload, FileSpreadsheet, KeyRound, Copy, RefreshCw, 
            Smartphone, Laptop, AlertCircle, CheckCheck 
        } = lucide;

        // --- Fungsi Utilitas Tanggal ---
        const formatDateKey = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const addDays = (date, days) => {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        };

        const getStartOfWeek = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff);
            d.setHours(0, 0, 0, 0);
            return d;
        };

        const isSameDay = (d1, d2) => formatDateKey(d1) === formatDateKey(d2);

        const sanitizeSyncCode = (raw) => {
            return raw.toLowerCase().trim().replace(/[^a-z0-9-_]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
        };

        const CATEGORIES = [
            { id: 'all', name: 'Semua Habit' },
            { id: 'Health', name: 'Kesehatan & Fisik' },
            { id: 'Mindfulness', name: 'Ketenangan Pikiran' },
            { id: 'Growth', name: 'Belajar & Bertumbuh' },
            { id: 'Productivity', name: 'Produktivitas' }
        ];

        const ICONS = {
            Dumbbell: { component: Dumbbell, label: 'Olahraga' },
            BookOpen: { component: BookOpen, label: 'Membaca' },
            Droplets: { component: Droplets, label: 'Air Putih' },
            Moon: { component: Moon, label: 'Tidur' },
            Brain: { component: Brain, label: 'Meditasi' },
            Code: { component: Code, label: 'Koding' },
            Apple: { component: Apple, label: 'Nutrisi' },
            Music: { component: Music, label: 'Latihan' },
            Sun: { component: Sun, label: 'Pagi' },
            Zap: { component: Zap, label: 'Fokus' }
        };

        const COLORS = [
            { id: 'emerald', name: 'Hijau Emerald', bg: 'bg-emerald-500', softBg: 'bg-emerald-500/15', text: 'text-emerald-400' },
            { id: 'indigo', name: 'Biru Indigo', bg: 'bg-indigo-500', softBg: 'bg-indigo-500/15', text: 'text-indigo-400' },
            { id: 'rose', name: 'Merah Rose', bg: 'bg-rose-500', softBg: 'bg-rose-500/15', text: 'text-rose-400' },
            { id: 'amber', name: 'Kuning Amber', bg: 'bg-amber-500', softBg: 'bg-amber-500/15', text: 'text-amber-400' },
            { id: 'cyan', name: 'Biru Cyan', bg: 'bg-cyan-500', softBg: 'bg-cyan-500/15', text: 'text-cyan-400' },
            { id: 'purple', name: 'Ungu Purple', bg: 'bg-purple-500', softBg: 'bg-purple-500/15', text: 'text-purple-400' }
        ];

        const generateInitialHabits = (today) => {
            const makeLogs = (pattern) => {
                const logs = {};
                pattern.forEach((completed, idx) => {
                    if (completed) {
                        const d = addDays(today, -idx);
                        logs[formatDateKey(d)] = true;
                    }
                });
                return logs;
            };

            return [
                {
                    id: 'h-1',
                    name: 'Minum 2.5L Air Putih',
                    description: 'Jaga tubuh tetap terhidrasi sepanjang hari',
                    category: 'Health',
                    icon: 'Droplets',
                    color: 'cyan',
                    targetPerWeek: 7,
                    logs: makeLogs([true, true, true, true, true, false, true, true, true, true, false, true, true, true])
                },
                {
                    id: 'h-2',
                    name: 'Olahraga / Jalan Pagi 30 Menit',
                    description: 'Sesi gym ringan, jogging, atau stretching',
                    category: 'Health',
                    icon: 'Dumbbell',
                    color: 'rose',
                    targetPerWeek: 5,
                    logs: makeLogs([true, false, true, true, false, true, true, false, true, true, false, true, false, true])
                },
                {
                    id: 'h-3',
                    name: 'Baca Buku 15 Halaman',
                    description: 'Buku pengembangan diri sebelum tidur',
                    category: 'Growth',
                    icon: 'BookOpen',
                    color: 'amber',
                    targetPerWeek: 6,
                    logs: makeLogs([false, true, true, true, true, true, false, true, true, true, true, false, true, true])
                }
            ];
        };

        function App() {
            const today = useMemo(() => {
                const d = new Date();
                d.setHours(0, 0, 0, 0);
                return d;
            }, []);

            const [user, setUser] = useState(null);
            const [syncCode, setSyncCode] = useState(() => localStorage.getItem('habit_sync_code') || 'habit-pribadi-2026');
            const [inputSyncCode, setInputSyncCode] = useState(syncCode);
            const [cloudStatus, setCloudStatus] = useState('connected');
            const [toastMessage, setToastMessage] = useState(null);
            const [copiedCode, setCopiedCode] = useState(false);

            const [habits, setHabits] = useState(() => {
                const saved = localStorage.getItem('habitpulse_habits_local');
                return saved ? JSON.parse(saved) : generateInitialHabits(today);
            });
            const [selectedDate, setSelectedDate] = useState(today);
            const [weekOffset, setWeekOffset] = useState(0);
            const [selectedCategory, setSelectedCategory] = useState('all');

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isCloudModalOpen, setIsCloudModalOpen] = useState(false);
            const [editingHabit, setEditingHabit] = useState(null);
            const [confirmActionModal, setConfirmActionModal] = useState(null);
            const fileInputRef = useRef(null);

            const [formData, setFormData] = useState({
                name: '',
                description: '',
                category: 'Health',
                icon: 'Dumbbell',
                color: 'emerald',
                targetPerWeek: 7
            });

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            // Inisialisasi Auth & Sinkronisasi Lokal / Fallback
            useEffect(() => {
                const checkFirebaseReady = setInterval(() => {
                    if (window.firebaseDb) {
                        clearInterval(checkFirebaseReady);
                        const { auth, signInAnonymously, onAuthStateChanged, db, doc, onSnapshot } = window.firebaseDb;
                        signInAnonymously(auth).catch(e => console.log('Auth fallback to local storage'));
                        onAuthStateChanged(auth, (u) => {
                            setUser(u);
                        });
                    }
                }, 200);
                return () => clearInterval(checkFirebaseReady);
            }, []);

            // Auto-Save LocalStorage agar berjalan instan tanpa jeda
            useEffect(() => {
                localStorage.setItem('habitpulse_habits_local', JSON.stringify(habits));
                localStorage.setItem('habit_sync_code', syncCode);
            }, [habits, syncCode]);

            const saveHabits = (updatedHabits) => {
                setHabits(updatedHabits);
                showToast('Perubahan berhasil disimpan!');
            };

            const handleApplySyncCode = (e) => {
                e.preventDefault();
                const cleaned = sanitizeSyncCode(inputSyncCode);
                if (!cleaned) return;
                setSyncCode(cleaned);
                localStorage.setItem('habit_sync_code', cleaned);
                showToast(`Kode Sinkronisasi diatur ke: ${cleaned}`);
                setIsCloudModalOpen(false);
            };

            const handleCopySyncCode = () => {
                navigator.clipboard?.writeText(syncCode);
                setCopiedCode(true);
                setTimeout(() => setCopiedCode(false), 2000);
                showToast('Kode berhasil disalin!');
            };

            const activeWeekStart = useMemo(() => {
                const baseStart = getStartOfWeek(today);
                return addDays(baseStart, weekOffset * 7);
            }, [today, weekOffset]);

            const weekDays = useMemo(() => {
                return Array.from({ length: 7 }, (_, i) => addDays(activeWeekStart, i));
            }, [activeWeekStart]);

            const calculateCurrentStreak = (logs = {}) => {
                let streak = 0;
                let checkDate = new Date(today);
                if (!logs[formatDateKey(checkDate)]) {
                    checkDate = addDays(checkDate, -1);
                }
                while (true) {
                    const key = formatDateKey(checkDate);
                    if (logs[key]) {
                        streak++;
                        checkDate = addDays(checkDate, -1);
                    } else {
                        break;
                    }
                }
                return streak;
            };

            const calculateBestStreak = (logs = {}) => {
                const dates = Object.keys(logs).filter((k) => logs[k]).sort();
                if (dates.length === 0) return 0;
                let maxStreak = 1, currentStreak = 1;
                for (let i = 1; i < dates.length; i++) {
                    const diff = Math.round((new Date(dates[i]) - new Date(dates[i - 1])) / (1000 * 60 * 60 * 24));
                    if (diff === 1) {
                        currentStreak++;
                        if (currentStreak > maxStreak) maxStreak = currentStreak;
                    } else if (diff > 1) {
                        currentStreak = 1;
                    }
                }
                return maxStreak;
            };

            const toggleHabitDate = (habitId, dateObj) => {
                if (dateObj > today) return;
                const dateKey = formatDateKey(dateObj);
                const updated = habits.map((h) => {
                    if (h.id !== habitId) return h;
                    const updatedLogs = { ...(h.logs || {}) };
                    if (updatedLogs[dateKey]) {
                        delete updatedLogs[dateKey];
                    } else {
                        updatedLogs[dateKey] = true;
                    }
                    return { ...h, logs: updatedLogs };
                });
                saveHabits(updated);
            };

            const handleSaveHabit = (e) => {
                e.preventDefault();
                if (!formData.name.trim()) return;
                let updated;
                if (editingHabit) {
                    updated = habits.map(h => h.id === editingHabit.id ? { ...h, ...formData } : h);
                    showToast('Habit diperbarui!');
                } else {
                    const newH = { id: `h-${Date.now()}`, ...formData, logs: {} };
                    updated = [...habits, newH];
                    showToast('Habit baru ditambahkan!');
                }
                saveHabits(updated);
                setIsModalOpen(false);
            };

            const handleDeleteHabit = (id) => {
                saveHabits(habits.filter(h => h.id !== id));
                setIsModalOpen(false);
                showToast('Habit dihapus.');
            };

            const handleExportCSV = () => {
                const daysList = Array.from({ length: 30 }, (_, idx) => addDays(today, -idx)).reverse();
                const headers = ['Nama Habit', 'Kategori', 'Target Mingguan', ...daysList.map(d => formatDateKey(d))];
                const rows = habits.map(h => [
                    `"${h.name}"`, `"${h.category}"`, h.targetPerWeek,
                    ...daysList.map(d => h.logs?.[formatDateKey(d)] ? 'SELESAI' : '-')
                ].join(','));
                const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows].join('\n');
                const link = document.createElement('a');
                link.setAttribute('href', encodeURI(csvContent));
                link.setAttribute('download', `HabitPulse_${formatDateKey(today)}.csv`);
                document.body.appendChild(link);
                link.click();
                link.remove();
                showToast('File Excel (.CSV) diunduh!');
            };

            const handleExportJSON = () => {
                const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(habits, null, 2));
                const link = document.createElement('a');
                link.setAttribute('href', dataStr);
                link.setAttribute('download', `HabitPulse_Backup_${formatDateKey(today)}.json`);
                document.body.appendChild(link);
                link.click();
                link.remove();
                showToast('File Backup (.JSON) diunduh!');
            };

            const handleImportJSON = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (Array.isArray(parsed)) {
                            saveHabits(parsed);
                            setIsCloudModalOpen(false);
                            showToast('Data berhasil dipulihkan!');
                        }
                    } catch (err) {
                        showToast('Gagal membaca file.');
                    }
                };
                reader.readAsText(file);
            };

            const filteredHabits = selectedCategory === 'all' ? habits : habits.filter(h => h.category === selectedCategory);
            const selectedDateKey = formatDateKey(selectedDate);
            const completedToday = habits.filter(h => h.logs?.[selectedDateKey]).length;
            const completionPct = habits.length > 0 ? Math.round((completedToday / habits.length) * 100) : 0;

            const weeklyAnalytics = useMemo(() => {
                const dayStats = weekDays.map((day) => {
                    const key = formatDateKey(day);
                    const isFuture = day > today;
                    const completed = isFuture ? 0 : habits.filter(h => h.logs?.[key]).length;
                    const pct = habits.length > 0 && !isFuture ? Math.round((completed / habits.length) * 100) : 0;
                    return { day, key, dayName: day.toLocaleDateString('id-ID', { weekday: 'short' }), dayNumber: day.getDate(), pct, isFuture, isToday: isSameDay(day, today) };
                });
                const validDays = dayStats.filter(d => !d.isFuture);
                const totalComp = validDays.reduce((acc, curr) => acc + curr.pct, 0);
                const successRate = validDays.length > 0 ? Math.round(totalComp / validDays.length) : 0;
                return { dayStats, successRate };
            }, [weekDays, habits, today]);

            const getColorStyles = (colorId) => COLORS.find(c => c.id === colorId) || COLORS[0];

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-16">
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2 bg-slate-900 border border-emerald-500/40 text-emerald-300 px-4 py-3 rounded-2xl shadow-2xl">
                            <CheckCircle2 className="w-5 h-5 text-emerald-400" />
                            <span className="text-xs sm:text-sm font-medium">{toastMessage}</span>
                        </div>
                    )}

                    <header className="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/90 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-emerald-500 flex items-center justify-center shadow-lg">
                                    <Flame className="w-6 h-6 text-white fill-white/20" />
                                </div>
                                <div>
                                    <h1 className="text-base sm:text-lg font-bold">HabitPulse</h1>
                                    <p className="text-xs text-slate-400 hidden sm:block">Dashboard Kebiasaan & Streak Harian</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsCloudModalOpen(true)} className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 text-xs sm:text-sm px-3 py-2 rounded-xl">
                                    <Smartphone className="w-4 h-4 text-indigo-400" />
                                    <span>Cloud & Data</span>
                                </button>
                                <button onClick={() => { setEditingHabit(null); setFormData({name: '', description: '', category: 'Health', icon: 'Dumbbell', color: 'emerald', targetPerWeek: 7}); setIsModalOpen(true); }} className="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm px-3.5 py-2 rounded-xl shadow-lg">
                                    <Plus className="w-4 h-4" />
                                    <span>Tambah Habit</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-6 space-y-6">
                        {/* Kartu Ringkasan KPI */}
                        <section className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                                <div>
                                    <span className="text-xs font-medium uppercase tracking-wider text-slate-400">Progres Hari Ini</span>
                                    <div className="mt-1 flex items-baseline gap-2">
                                        <span className="text-3xl font-extrabold text-white">{completedToday}</span>
                                        <span className="text-sm text-slate-400">/ {habits.length} selesai</span>
                                    </div>
                                </div>
                                <div className="text-2xl font-bold text-emerald-400">{completionPct}%</div>
                            </div>

                            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                                <div>
                                    <span className="text-xs font-medium uppercase tracking-wider text-slate-400">Streak Tertinggi</span>
                                    <div className="mt-1 flex items-baseline gap-2">
                                        <span className="text-3xl font-extrabold text-amber-400">
                                            {habits.length ? Math.max(...habits.map(h => calculateCurrentStreak(h.logs))) : 0}
                                        </span>
                                        <span className="text-sm text-slate-400">hari</span>
                                    </div>
                                </div>
                                <div className="w-12 h-12 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400">
                                    <Flame className="w-6 h-6 fill-amber-400/20" />
                                </div>
                            </div>

                            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                                <div>
                                    <span className="text-xs font-medium uppercase tracking-wider text-slate-400">Konsistensi Mingguan</span>
                                    <div className="mt-1 flex items-baseline gap-2">
                                        <span className="text-3xl font-extrabold text-indigo-400">{weeklyAnalytics.successRate}%</span>
                                    </div>
                                </div>
                                <div className="w-12 h-12 rounded-2xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                                    <TrendingUp className="w-6 h-6" />
                                </div>
                            </div>
                        </section>

                        {/* Layout Utama */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                            {/* Kolom Kiri: Check-in Harian */}
                            <div className="lg:col-span-5 bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <div>
                                        <h2 className="text-lg font-bold text-white">Log Harian</h2>
                                        <p className="text-xs text-slate-400">{selectedDate.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
                                    </div>
                                    <div className="flex items-center gap-1 bg-slate-950 border border-slate-800 rounded-xl p-1">
                                        <button onClick={() => setSelectedDate(addDays(selectedDate, -1))} className="p-1 hover:bg-slate-800 rounded-lg text-slate-400"><ChevronLeft className="w-4 h-4" /></button>
                                        <button onClick={() => setSelectedDate(today)} className="px-2 py-1 text-xs text-slate-300">Hari Ini</button>
                                        <button onClick={() => { const next = addDays(selectedDate, 1); if(next <= today) setSelectedDate(next); }} className="p-1 hover:bg-slate-800 rounded-lg text-slate-400"><ChevronRight className="w-4 h-4" /></button>
                                    </div>
                                </div>

                                <div className="flex gap-1 overflow-x-auto pb-1">
                                    {CATEGORIES.map(cat => (
                                        <button key={cat.id} onClick={() => setSelectedCategory(cat.id)} className={`px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap ${selectedCategory === cat.id ? 'bg-indigo-600 text-white' : 'bg-slate-950 text-slate-400'}`}>
                                            {cat.name}
                                        </button>
                                    ))}
                                </div>

                                <div className="space-y-3">
                                    {filteredHabits.map(habit => {
                                        const isDone = !!habit.logs?.[selectedDateKey];
                                        const colorStyle = getColorStyles(habit.color);
                                        const IconComp = ICONS[habit.icon]?.component || Dumbbell;
                                        return (
                                            <div key={habit.id} onClick={() => toggleHabitDate(habit.id, selectedDate)} className={`flex items-center justify-between p-4 rounded-2xl border cursor-pointer transition ${isDone ? 'bg-slate-950/60 border-emerald-500/40' : 'bg-slate-950/90 border-slate-800'}`}>
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-7 h-7 rounded-xl flex items-center justify-center ${isDone ? `${colorStyle.bg} text-white` : 'bg-slate-900 border-2 border-slate-700 text-transparent'}`}>
                                                        <Check className="w-4 h-4 stroke-[3]" />
                                                    </div>
                                                    <div>
                                                        <h3 className={`font-medium text-sm ${isDone ? 'line-through text-slate-400' : 'text-slate-100'}`}>{habit.name}</h3>
                                                        <span className={`text-[11px] px-2 py-0.5 rounded-md ${colorStyle.softBg} ${colorStyle.text}`}>{habit.category}</span>
                                                    </div>
                                                </div>
                                                <button onClick={(e) => { e.stopPropagation(); setEditingHabit(habit); setFormData({name: habit.name, description: habit.description || '', category: habit.category, icon: habit.icon, color: habit.color, targetPerWeek: habit.targetPerWeek}); setIsModalOpen(true); }} className="p-1.5 text-slate-500 hover:text-slate-200">
                                                    <Edit3 className="w-4 h-4" />
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Kolom Kanan: Tabel Matriks Mingguan */}
                            <div className="lg:col-span-7 bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                        <Calendar className="w-5 h-5 text-indigo-400" /> Tabel Streak Mingguan
                                    </h2>
                                    <div className="flex items-center gap-1 bg-slate-950 border border-slate-800 rounded-xl p-1">
                                        <button onClick={() => setWeekOffset(w => w - 1)} className="p-1 hover:bg-slate-800 rounded-lg text-slate-400"><ChevronLeft className="w-4 h-4" /></button>
                                        <span className="px-2 text-xs font-semibold">{weekDays[0].toLocaleDateString('id-ID', {day:'numeric', month:'short'})}</span>
                                        <button onClick={() => setWeekOffset(w => Math.min(0, w + 1))} className="p-1 hover:bg-slate-800 rounded-lg text-slate-400"><ChevronRight className="w-4 h-4" /></button>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full border-collapse min-w-[500px]">
                                        <thead>
                                            <tr>
                                                <th className="text-left pb-3 text-xs text-slate-400">Habit</th>
                                                {weekDays.map(d => (
                                                    <th key={formatDateKey(d)} className="pb-3 text-center text-xs text-slate-400">
                                                        {d.toLocaleDateString('id-ID', {weekday:'short'})} <br/> {d.getDate()}
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800/60">
                                            {habits.map(habit => {
                                                const colorStyle = getColorStyles(habit.color);
                                                return (
                                                    <tr key={habit.id}>
                                                        <td className="py-3 text-sm font-medium text-slate-200">{habit.name}</td>
                                                        {weekDays.map(d => {
                                                            const key = formatDateKey(d);
                                                            const done = !!habit.logs?.[key];
                                                            return (
                                                                <td key={key} className="py-3 text-center">
                                                                    <button disabled={d > today} onClick={() => toggleHabitDate(habit.id, d)} className={`w-8 h-8 rounded-xl mx-auto flex items-center justify-center transition ${d > today ? 'opacity-30 bg-slate-900 cursor-not-allowed' : done ? `${colorStyle.bg} text-white` : 'bg-slate-950 border border-slate-800'}`}>
                                                                        <Check className="w-4 h-4 stroke-[3]" />
                                                                    </button>
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Modal Sinkronisasi & Backup */}
                    {isCloudModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-5">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-base font-bold text-white">Kelola Data & Sinkronisasi</h3>
                                    <button onClick={() => setIsCloudModalOpen(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                                </div>
                                <div className="space-y-3">
                                    <label className="text-xs font-bold uppercase text-indigo-400">Kode Sinkronisasi Perangkat</label>
                                    <form onSubmit={handleApplySyncCode} className="flex gap-2">
                                        <input type="text" value={inputSyncCode} onChange={e => setInputSyncCode(e.target.value)} className="flex-1 px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm font-mono text-white" />
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl">Simpan</button>
                                    </form>
                                    <button onClick={handleCopySyncCode} className="text-xs text-indigo-400 flex items-center gap-1"><Copy className="w-3.5 h-3.5"/> Salin Kode</button>
                                </div>
                                <div className="pt-3 border-t border-slate-800 grid grid-cols-2 gap-2">
                                    <button onClick={handleExportCSV} className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-semibold text-emerald-400 flex items-center justify-center gap-1"><FileSpreadsheet className="w-4 h-4"/> Unduh Excel</button>
                                    <button onClick={handleExportJSON} className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-semibold text-indigo-400 flex items-center justify-center gap-1"><Download className="w-4 h-4"/> Backup JSON</button>
                                </div>
                                <div>
                                    <input ref={fileInputRef} type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                                    <button onClick={() => fileInputRef.current?.click()} className="w-full p-3 bg-slate-950 border border-dashed border-slate-700 text-xs text-slate-300 rounded-xl">Pulihkan dari File Backup</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Tambah/Edit Habit */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-lg font-bold text-white">{editingHabit ? 'Ubah Habit' : 'Tambah Habit'}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                                </div>
                                <form onSubmit={handleSaveHabit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs uppercase text-slate-400 mb-1">Nama Habit</label>
                                        <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white" />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase text-slate-400 mb-1">Kategori</label>
                                        <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white">
                                            {CATEGORIES.filter(c => c.id !== 'all').map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex justify-between pt-2">
                                        {editingHabit ? <button type="button" onClick={() => handleDeleteHabit(editingHabit.id)} className="text-rose-400 text-xs font-semibold flex items-center gap-1"><Trash2 className="w-4 h-4"/> Hapus</button> : <div/>}
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-xs text-slate-300">Batal</button>
                                            <button type="submit" className="px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl">Simpan</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
