<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitPulse - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [habits, setHabits] = React.useState([
                { id: 1, name: 'Minum Air Putih', done: false },
                { id: 2, name: 'Olahraga 15 Menit', done: false },
                { id: 3, name: 'Membaca Buku', done: false }
            ]);

            const toggleHabit = (id) => {
                setHabits(habits.map(h => h.id === id ? { ...h, done: !h.done } : h));
            };

            return (
                <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <h1 className="text-xl font-bold mb-2">⚡ HabitPulse Dashboard</h1>
                    <p className="text-xs text-slate-400 mb-6">Aplikasi pelacak kebiasaan harian Anda.</p>
                    
                    <div className="space-y-3">
                        {habits.map(h => (
                            <div key={h.id} onClick={() => toggleHabit(h.id)} className={`p-4 rounded-xl border cursor-pointer flex justify-between items-center transition ${h.done ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-200'}`}>
                                <span className={h.done ? 'line-through opacity-75' : ''}>{h.name}</span>
                                <span className="text-xs font-semibold">{h.done ? '✓ Selesai' : 'Belum'}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
