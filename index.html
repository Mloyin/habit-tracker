<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitPulse - Dashboard Kebiasaan</title>
    <!-- Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel untuk Tampilan Interaktif -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function HabitTracker() {
            const [habits, setHabits] = useState([
                { id: 1, name: 'Minum Air Putih (2L)', category: 'Kesehatan', target: 7, color: 'blue', icon: 'Droplets' },
                { id: 2, name: 'Olahraga / Stretching 15 Min', category: 'Kebugaran', target: 5, color: 'emerald', icon: 'Activity' },
                { id: 3, name: 'Membaca Buku 20 Halaman', category: 'Pengembangan', target: 7, color: 'purple', icon: 'BookOpen' },
                { id: 4, name: 'Meditasi / Sholat Tepat Waktu', category: 'Spiritual', target: 7, color: 'amber', icon: 'Heart' },
                { id: 5, name: 'Belajar Coding / Skill Baru', category: 'Karier', target: 5, color: 'indigo', icon: 'Code' }
            ]);

            const [logs, setLogs] = useState({});
            const [syncCode, setSyncCode] = useState(() => localStorage.getItem('habit_sync_code') || 'habits-pribadi-2026');
            const [isCloudActive, setIsCloudActive] = useState(false);
            const [showSyncModal, setShowSyncModal] = useState(false);
            const [activeTab, setActiveTab] = useState('daily');
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().slice(0, 10));

            // Load data awal dari LocalStorage
            useEffect(() => {
                const savedHabits = localStorage.getItem('habitpulse_habits');
                const savedLogs = localStorage.getItem('habitpulse_logs');
                if (savedHabits) setHabits(JSON.parse(savedHabits));
                if (savedLogs) setLogs(JSON.parse(savedLogs));
            }, []);

            // Auto-Save ke LocalStorage
            useEffect(() => {
                localStorage.setItem('habitpulse_habits', JSON.stringify(habits));
                localStorage.setItem('habitpulse_logs', JSON.stringify(logs));
                localStorage.setItem('habit_sync_code', syncCode);
            }, [habits, logs, syncCode]);

            const toggleLog = (habitId, dateStr) => {
                setLogs(prev => ({
                    ...prev,
                    [habitId]: {
                        ...(prev[habitId] || {}),
                        [dateStr]: !(prev[habitId]?.[dateStr])
                    }
                }));
            };

            const exportToCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,Habit,Kategori,Tanggal,Status\n";
                habits.forEach(h => {
                    Object.keys(logs[h.id] || {}).forEach(date => {
                        if (logs[h.id][date]) {
                            csvContent += `"${h.name}","${h.category}",${date},Selesai\n`;
                        }
                    });
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `laporan_habit_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                link.remove();
            };

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-900 flex items-center gap-2">
                                ⚡ HabitPulse Dashboard
                            </h1>
                            <p className="text-sm text-slate-500">Kelola target harianmu dan pantau konsistensimu.</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            <button onClick={() => setShowSyncModal(true)} className="px-4 py-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-xl text-sm font-medium transition">
                                ☁️ Kode Sinkronisasi ({syncCode})
                            </button>
                            <button onClick={exportToCSV} className="px-4 py-2 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-xl text-sm font-medium transition">
                                📥 Unduh Excel (.CSV)
                            </button>
                        </div>
                    </header>

                    {/* Navigasi Tab */}
                    <div className="flex gap-2 mb-6 border-b border-slate-200 pb-2">
                        <button onClick={() => setActiveTab('daily')} className={`px-4 py-2 rounded-xl font-medium text-sm transition ${activeTab === 'daily' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>
                            📅 Check-In Harian
                        </button>
                        <button onClick={() => setActiveTab('analytics')} className={`px-4 py-2 rounded-xl font-medium text-sm transition ${activeTab === 'analytics' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>
                            📊 Statistik & Streak
                        </button>
                    </div>

                    {/* Konten Utama */}
                    {activeTab === 'daily' && (
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="font-bold text-lg text-slate-800">Daftar Habit Hari Ini</h2>
                                <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="px-3 py-1.5 border rounded-xl text-sm" />
                            </div>
                            <div className="space-y-3">
                                {habits.map(habit => {
                                    const isChecked = logs[habit.id]?.[selectedDate] || false;
                                    return (
                                        <div key={habit.id} onClick={() => toggleLog(habit.id, selectedDate)} className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${isChecked ? 'bg-emerald-50/50 border-emerald-200' : 'bg-white border-slate-200 hover:border-slate-300'}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`w-6 h-6 rounded-lg flex items-center justify-center border ${isChecked ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'}`}>
                                                    {isChecked && '✓'}
                                                </div>
                                                <div>
                                                    <h3 className={`font-medium ${isChecked ? 'line-through text-slate-400' : 'text-slate-800'}`}>{habit.name}</h3>
                                                    <span className="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">{habit.category}</span>
                                                </div>
                                            </div>
                                            <span className="text-xs font-medium text-slate-400">{isChecked ? 'Selesai ✨' : 'Belum'}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {activeTab === 'analytics' && (
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                            <h2 className="font-bold text-lg text-slate-800 mb-2">Statistik Habit</h2>
                            <p className="text-sm text-slate-500">Data harian tersimpan otomatis di browser perangkat Anda dan aman.</p>
                        </div>
                    )}

                    {/* Modal Sinkronisasi */}
                    {showSyncModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">Atur Kode Sinkronisasi</h3>
                                <p className="text-sm text-slate-500 mb-4">Gunakan kode yang sama di HP dan Laptop Anda agar datanya sinkron.</p>
                                <input type="text" value={syncCode} onChange={(e) => setSyncCode(e.target.value)} placeholder="Contoh: habit-farhan-2026" className="w-full px-4 py-2 border rounded-xl mb-4 text-sm font-mono" />
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setShowSyncModal(false)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium">Simpan & Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<HabitTracker />, document.getElementById('root'));
    </script>
</body>
</html>
